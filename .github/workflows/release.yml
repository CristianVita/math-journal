# Builds the desktop app for Windows and Linux when a version tag (v0.1.0, v0.2.0, …) is pushed,
# and attaches the installers (plus a portable Windows exe) to a draft GitHub release.
name: Release desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: 'Jurnal Meditații v__VERSION__'
          releaseBody: 'Windows: *-setup.exe instalează aplicația; *-portable.exe pornește direct, fără instalare. Linux: .AppImage (orice distribuție), .deb (Ubuntu/Debian) sau .rpm (Fedora).'
          releaseDraft: true
          prerelease: false

      # The app exe itself runs without installing (the UI is embedded; Windows 10/11 ship WebView2).
      # Uploaded by release id: a draft release cannot be looked up by its tag.
      - name: Portable Windows exe
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
          VERSION: ${{ steps.tauri.outputs.appVersion }}
        run: |
          name="Jurnal.Meditatii_${VERSION}_x64-portable.exe"
          cp src-tauri/target/release/math-journal.exe "$name"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/vnd.microsoft.portable-executable" \
            --data-binary @"$name" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=${name}" > /dev/null
          echo "uploaded $name"
